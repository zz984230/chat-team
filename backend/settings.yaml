server:
  host: "0.0.0.0"
  port: 8000
  cors_origins: ["http://localhost:3000"]

agent:
  max_concurrent: 5
  timeout_seconds: 300
  retry_count: 1
  work_dir: "/tmp/agentoffice"

vault:
  path: "./vault"

workflow:
  default_mode: "default"
  brainstorm_rounds: 3

logging:
  level: "INFO"
  file: "./logs/agentoffice.log"
